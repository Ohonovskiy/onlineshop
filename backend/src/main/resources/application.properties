spring.application.name=onlineshop

#DB source
spring.datasource.url=jdbc:postgresql://localhost:5432/onlineshop?reWriteBatchedInserts=true
spring.jpa.properties.hibernate.default_schema=public
spring.datasource.username=postgres
spring.datasource.password=postgres

# API
delivery.np.api.key=2e7ec036e5789c7a71a78e9ee18283fa
delivery.np.api.url=https://api.novaposhta.ua/v2.0/json/

# HIBERNATE
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database=postgresql
spring.session.jdbc.initialize-schema=always
spring.jpa.show-sql=true


#BATCH
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# SERVER
server.servlet.context-path=/api/v1

app.upload-dir=C:/Users/PC/Documents/onlineshop/backend/uploads
app.upload-url=/uploads
